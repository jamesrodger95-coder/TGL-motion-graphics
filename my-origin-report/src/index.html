<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>My Origin Report — Motion Reel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- A 1920x1080 stage, or 1080x1920 with ?format=9x16 (js/layout.js).
         js/main.js positions everything as a pure function of time, so any
         frame can be rendered in any order. -->
    <div id="stage">
      <div id="paper" class="layer"></div>
      <div id="doc3d" class="layer"><div id="doc"></div></div>
      <div id="night" class="layer">
        <div id="mapview" class="layer"></div>
        <div id="report" class="layer"></div>
        <canvas id="dust" width="1920" height="1080"></canvas>
        <div id="end" class="layer"></div>
      </div>
      <canvas id="fx" width="1920" height="1080"></canvas>
      <div id="type" class="layer"></div>
      <div id="grade" class="layer"></div>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
