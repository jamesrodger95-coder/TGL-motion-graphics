<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>A.Jain — Motion Reel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- A 1080x1920 (9:16) stage. js/main.js positions everything as a pure
         function of time, so any frame can be rendered in any order. -->
    <div id="stage">
      <div id="wash" class="layer"></div>
      <div id="mosaic" class="layer"></div>
      <div id="ring" class="layer"></div>
      <div id="card" class="abs"></div>
      <div id="brand" class="layer"></div>
      <div id="sign" class="layer"></div>
      <div id="grade" class="layer"></div>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
