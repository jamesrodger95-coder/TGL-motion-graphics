<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sydney's Plumbing Specialists — Motion Reel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- A 1920x1080 stage. js/main.js positions everything as a pure function
         of time, so any frame can be rendered in any order. The world is three
         screens tall; the camera follows the water down it. -->
    <div id="stage">
      <div id="bg" class="layer"><div id="grid"></div></div>
      <div id="glow" class="layer"></div>
      <div id="world"></div>
      <div id="grade" class="layer"></div>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
