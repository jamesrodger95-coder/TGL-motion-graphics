<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <title>Modus Projects — Motion Reel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- A 1920x1080 stage. js/main.js positions everything as a pure function
         of time, so any frame can be rendered in any order. -->
    <div id="stage">
      <canvas id="film" width="1920" height="1080"></canvas>
      <div id="shade" class="layer"></div>
      <svg id="pins" class="layer" viewBox="0 0 1920 1080"></svg>
      <div id="labels" class="layer"></div>
      <div id="type" class="layer"></div>
      <div id="panels" class="layer"></div>
      <div id="end" class="layer"></div>
      <div id="grade" class="layer"></div>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
