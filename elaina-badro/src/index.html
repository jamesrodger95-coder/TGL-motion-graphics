<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Elaina Badro — Motion Reel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- A 1080x1920 (9:16) stage. js/main.js positions everything as a pure
         function of time, so any frame can be rendered in any order. -->
    <div id="stage">
      <div id="product" class="layer"><img id="lipstick" src="img/lipstick.jpg" alt="" /></div>
      <div id="line" class="line">You deserve luxury.</div>
      <div id="logo" class="abs"></div>
      <div id="site" class="site">elainabadro.com</div>
      <div id="grade" class="layer"></div>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
