<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Tandem — Motion Reel</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- A 1920x1080 stage. js/main.js positions everything as a pure function
         of time, so any frame can be rendered in any order. -->
    <div id="stage">
      <div id="a" class="layer"></div>
      <div id="b" class="layer"></div>
      <div id="wipe" class="layer"></div>
      <div id="c" class="layer"></div>
      <div id="grade" class="layer"></div>
    </div>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
